[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-ddos-research"
version = "0.1.0"
description = "Reproducible multi-source DDoS detection experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2.3,<4", "pyarrow>=19,<25", "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "plotly>=5.24,<7", "requests>=2.32,<3", "joblib>=1.4,<2"]

[project.optional-dependencies]
spark = ["pyspark==4.0.1"]
boost = ["xgboost>=2.1,<4", "lightgbm>=4.5,<5", "catboost>=1.2.8,<2"]
notebooks = ["nbformat>=5.10,<6", "ipykernel>=6,<8"]

[project.scripts]
ddos-research = "sdn_ddos.cli:main"

[tool.setuptools.packages.find]
include = ["sdn_ddos*"]
